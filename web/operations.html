<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line operations</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #11161c; color: #dfe6ee; }
header { padding: 16px 24px; background: #182029; border-bottom: 1px solid #26313d; }
h1 { font-size: 18px; margin: 0 0 4px; }
nav a { color: #7fb2e6; margin-right: 16px; text-decoration: none; font-size: 13px; }
section { padding: 16px 24px; }
button { background: #26445f; color: #dfe6ee; border: 1px solid #35566f; padding: 6px 12px; margin: 3px 6px 3px 0; border-radius: 4px; cursor: pointer; }
input { background: #0d1218; color: #dfe6ee; border: 1px solid #2b3946; padding: 5px 8px; border-radius: 4px; margin-right: 6px; }
pre { background: #0d1218; padding: 12px; border-radius: 6px; overflow: auto; font-size: 12px; min-height: 160px; }
</style>
</head>
<body>
<header>
  <h1>Operations</h1>
  <nav><a href="/">overview</a><a href="/operations">operations</a><a href="/records">records</a></nav>
</header>
<section>
  <div>
    <input id="batch" value="B-1" size="8">
    <input id="quantity" value="12" size="5">
    <input id="level" value="0.9" size="5">
    <input id="sulfur" value="6" size="5">
    <input id="pressure" value="1500" size="6">
    <input id="methane" value="97" size="5">
  </div>
  <div id="actions"></div>
  <pre id="output">ready</pre>
</section>
<script id="bootstrap" type="application/json"><!--STATE--></script>
<script>
const commands = [
  ['/api/stir/start', {}],
  ['/api/stir/homogenize', null, 'level'],
  ['/api/stir/persist', {}],
  ['/api/feed/batch', null, 'batch'],
  ['/api/feed/start', {}],
  ['/api/feed/close', {}],
  ['/api/heater/ramp', {target_c: 36}],
  ['/api/desul/check', null, 'sulfur'],
  ['/api/compress/start', {}],
  ['/api/mem/valve', {}],
  ['/api/mem/analyze', null, 'methane'],
  ['/api/gas/inlet', {}]
];
const labels = {
  '/api/stir/start': 'stir start',
  '/api/stir/homogenize': 'homogenize',
  '/api/stir/persist': 'persist mix',
  '/api/feed/batch': 'declare batch',
  '/api/feed/start': 'open gate',
  '/api/feed/close': 'close gate',
  '/api/heater/ramp': 'heat ramp',
  '/api/desul/check': 'verify outlet',
  '/api/compress/start': 'start compressor',
  '/api/mem/valve': 'open valve',
  '/api/mem/analyze': 'analyse gas',
  '/api/gas/inlet': 'open inlet'
};
function payloadFor(entry) {
  const [, preset, source] = entry;
  if (preset) return preset;
  if (source === 'level') return {level: Number(document.getElementById('level').value)};
  if (source === 'batch') return {
    batch_id: document.getElementById('batch').value,
    quantity: Number(document.getElementById('quantity').value)
  };
  if (source === 'sulfur') return {sulfur_ppm: Number(document.getElementById('sulfur').value)};
  return {};
}
const bar = document.getElementById('actions');
commands.forEach((entry) => {
  const path = entry[0];
  const button = document.createElement('button');
  button.textContent = labels[path] || path;
  button.addEventListener('click', function () {
    fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payloadFor(entry))
    }).then((r) => r.json()).then((data) => {
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    });
  });
  bar.appendChild(button);
});
</script>
</body>
</html>
