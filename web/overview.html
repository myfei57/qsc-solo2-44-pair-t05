<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line overview</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #11161c; color: #dfe6ee; }
header { padding: 16px 24px; background: #182029; border-bottom: 1px solid #26313d; }
h1 { font-size: 18px; margin: 0 0 4px; }
nav a { color: #7fb2e6; margin-right: 16px; text-decoration: none; font-size: 13px; }
section { padding: 16px 24px; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #8fa2b5; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #232e39; }
.ok { color: #6ad48b; }
.warn { color: #e6b25e; }
.bad { color: #e8695f; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 9px; background: #223040; font-size: 12px; }
.track { width: 240px; height: 10px; background: #0d1218; border: 1px solid #2b3946; border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; }
.fill { height: 100%; background: #4d8f6a; }
.fill.bad { background: #b34a42; }
.fill.wait { background: #c08a3e; }
button { background: #26445f; color: #dfe6ee; border: 1px solid #35566f; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
pre { background: #0d1218; padding: 12px; border-radius: 6px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Overview</h1>
  <nav><a href="/">overview</a><a href="/operations">operations</a><a href="/records">records</a></nav>
</header>
<section>
  <h2>Line state</h2>
  <table id="lines"><tbody></tbody></table>
</section>
<section>
  <h2>Subsystems</h2>
  <table id="subsystems"><tbody></tbody></table>
</section>
<section>
  <h2>Vent recovery window</h2>
  <table id="vent-recovery"><tbody></tbody></table>
</section>
<section>
  <h2>Alarms</h2>
  <table id="alarms"><tbody></tbody></table>
</section>
<section>
  <h2>Watermark</h2>
  <pre id="watermark"></pre>
  <button id="refresh">refresh</button>
</section>
<script id="bootstrap" type="application/json"><!--STATE--></script>
<script>
function render(state) {
  const lines = document.querySelector('#lines tbody');
  lines.innerHTML = '';
  Object.keys(state.lines).forEach((name) => {
    const line = state.lines[name];
    const row = document.createElement('tr');
    row.innerHTML = `<td>${name}</td><td><span class="pill">${line.phase}</span></td><td>next: ${line.next || 'end'}</td>`;
    lines.appendChild(row);
  });
  const body = document.querySelector('#subsystems tbody');
  body.innerHTML = '';
  Object.keys(state.subsystems).forEach((name) => {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${name}</td><td><code>${JSON.stringify(state.subsystems[name])}</code></td>`;
    body.appendChild(row);
  });
  const alarms = document.querySelector('#alarms tbody');
  alarms.innerHTML = '';
  (state.alarms || []).forEach((alarm) => {
    const row = document.createElement('tr');
    row.innerHTML = `<td class="bad">${alarm.name}</td><td>${alarm.origin}</td><td>tick ${alarm.tick}</td>`;
    alarms.appendChild(row);
  });
  renderVentRecovery(state);
  document.querySelector('#watermark').textContent = JSON.stringify(state.watermark, null, 2);
}

function renderVentRecovery(state) {
  const body = document.querySelector('#vent-recovery tbody');
  body.innerHTML = '';
  const vent = (state.subsystems && state.subsystems.vent) || {};
  const recovery = vent.recovery || {};
  const size = recovery.window_size || 0;
  const capacity = recovery.window_capacity || 0;
  const pct = capacity ? Math.round((recovery.window_progress || 0) * 100) : 0;
  const latched = vent.latched === true;
  const flaring = vent.flaring === true;
  const barClass = recovery.ready ? '' : (recovery.all_above_floor ? 'wait' : 'bad');
  const fillId = 'vr-fill';
  const note = recovery.reason || '';
  const clearAllowed = latched && flaring && recovery.ready === true;
  const minText = recovery.minimum === null || recovery.minimum === undefined ? '—' : Number(recovery.minimum).toFixed(2);
  const hint = !latched ? 'latch is clear'
    : !flaring ? 'flare is not open — clear is locked'
    : recovery.ready ? 'window complete — clear allowed'
    : 'waiting for a full window above the floor';
  const hintClass = clearAllowed ? 'ok' : (latched && !flaring ? 'bad' : 'warn');
  body.innerHTML =
    '<tr><td>phase</td><td><span class="pill">' + (vent.phase || '—') + '</span></td>' +
    '<td>flaring: <b class="' + (flaring ? 'ok' : 'bad') + '">' + flaring + '</b></td></tr>' +
    '<tr><td>window</td><td><span class="track"><span id="' + fillId + '" class="fill ' + barClass +
      '" style="width:' + pct + '%"></span></span> ' + size + ' / ' + capacity + ' samples (' + pct + '%)</td>' +
    '<td>min ' + minText + ' % / floor ' + Number(recovery.floor || 0).toFixed(2) + ' %</td></tr>' +
    '<tr><td>clear</td><td class="' + hintClass + '">' + hint + '</td><td>' + note + '</td></tr>';
}
render(JSON.parse(document.getElementById('bootstrap').textContent));
document.getElementById('refresh').addEventListener('click', function () {
  fetch('/api/state').then((r) => r.json()).then(render);
});
</script>
</body>
</html>
