[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-control-runtime"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
line-control = "bgs.__main__:main"

[tool.setuptools.packages.find]
include = ["bgs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
